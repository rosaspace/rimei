version: "3.9"

services:

  web:
    build: .
    container_name: django_prod
    command: python manage.py runserver 0.0.0.0:8888
    expose:
      - "8888"
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    

  nginx:
    image: nginx:latest
    container_name: nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/rimeius.conf:/etc/nginx/conf.d/rimeius.conf:ro
      - ./static:/code/static:ro
    env_file:
      - ./nginx/.env
    depends_on:
      - web
