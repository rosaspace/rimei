# ==================== Prop =======================

server {
    listen 80;
    server_name rimeius.com www.rimeius.com;

    # location / {
    #     proxy_pass http://web:8888;
    # }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    server_name rimeius.com www.rimeius.com;

    ssl_certificate /etc/letsencrypt/live/rimeius.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rimeius.com/privkey.pem;

    client_max_body_size 6M;   # ✅ 允许最大上传 2MB

    location / {
        proxy_pass http://web:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /code/static/;
    }
}